# sheprd: build a static linux x86_64 binary and publish it as a GitHub release
# on every `sheprd-v*` tag (e.g. sheprd-v0.9.3-1). Upstream workflows are
# disabled on this fork; this is the only one that runs.
name: sheprd release

on:
  push:
    tags: ['sheprd-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-x86_64-musl

      - name: Build
        run: |
          rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/herdr sheprd-linux-x86_64
          sha256sum sheprd-linux-x86_64 > sheprd-linux-x86_64.sha256

      - name: Publish release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" sheprd-linux-x86_64 sheprd-linux-x86_64.sha256 scripts/sheprd-install \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "sheprd build of $(git rev-parse --short HEAD) on herdr ${GITHUB_REF_NAME#sheprd-v}. See the README for what differs from herdr."
