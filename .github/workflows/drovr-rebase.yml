# drovr: follow herdr/master. Daily, compare drovr main's upstream base (the
# merge-base of main and herdr/master) with herdr/master. When herdr/master has
# moved, rebase drovr's own commits (base..main) onto it and report the result
# in one issue per herdr/master commit, named by its 12-character sha:
#   clean (or replayed by rerere) + tests pass -> push branch rebase/herdr-<sha>
#                                                 and mark the issue ready
#   tests fail -> nothing is pushed; the issue links the failing run
#   conflict   -> nothing is pushed; the issue lists the conflicting files and
#                 the upstream commits that touched them
# The issue is updated on later runs for the same commit; a comment is added
# only when the status changes. When herdr/master moves again, open issues for
# older commits are closed as superseded, and once a newer rebase is ready the
# older rebase/herdr-* branches are deleted. main is never touched here;
# "drovr promote" ships a ready rebase. Resolutions recorded with `git rerere`
# live in .github/rr-cache, so a conflict resolved once is replayed next time.
#
# Jobs are split so that upstream code is only built in a job that has no
# write token: `rebase` and `test` run with contents: read and no persisted
# credentials; only `report` can push and write issues.
#
# Required secret: DROVR_PUSH_TOKEN, a fine-grained PAT for sbusso/drovr with
# "Contents: read and write" and "Workflows: read and write". GITHUB_TOKEN
# cannot push a branch whose commits change .github/workflows, which herdr
# commits regularly do.
name: drovr rebase

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: drovr-rebase
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      status: ${{ steps.rebase.outputs.status || 'skip' }}
      target: ${{ steps.find.outputs.target }}
      short: ${{ steps.find.outputs.short }}
      base: ${{ steps.find.outputs.base }}
      main_sha: ${{ steps.find.outputs.main_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Compare with herdr/master
        id: find
        run: |
          git fetch --quiet --no-tags https://github.com/herdrdev/herdr.git master
          target=$(git rev-parse FETCH_HEAD)
          short=$(git rev-parse --short=12 "$target")
          base=$(git merge-base HEAD "$target")
          echo "target=$target base=$base main=$(git rev-parse HEAD)"
          {
            echo "target=$target"
            echo "short=$short"
            echo "base=$base"
            echo "main_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          if [ "$base" = "$target" ]; then
            echo "main already contains herdr/master"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code origin "refs/heads/rebase/herdr-$short" >/dev/null; then
            echo "rebase/herdr-$short is already waiting to be promoted"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase
        id: rebase
        if: steps.find.outputs.skip != 'true'
        env:
          TARGET: ${{ steps.find.outputs.target }}
          SHORT: ${{ steps.find.outputs.short }}
          BASE: ${{ steps.find.outputs.base }}
        run: |
          git config user.name "drovr bot"
          git config user.email "drovr-bot@users.noreply.github.com"
          git config rerere.enabled true
          git config rerere.autoupdate true
          mkdir -p .git/rr-cache && cp -r .github/rr-cache/. .git/rr-cache/ 2>/dev/null || true
          mkdir -p out
          git checkout -b "rebase/herdr-$SHORT"
          git rebase --onto "$TARGET" "$BASE" || true
          # rerere stages known resolutions; keep continuing while that is enough.
          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            files=$(git diff --name-only --diff-filter=U)
            if [ -n "$files" ]; then
              {
                echo "Rebasing drovr onto herdr $SHORT stopped on conflicts. Nothing was pushed."
                echo
                echo "Files:"
                # shellcheck disable=SC2016 # literal backticks for markdown
                echo "$files" | sed 's/^/- `/;s/$/`/'
                echo
                echo "Upstream commits touching them (${BASE:0:12}..$SHORT):"
                echo '```'
                # shellcheck disable=SC2086 # one path per word
                git log --oneline "$BASE..$TARGET" -- $files
                echo '```'
                echo
                echo "Resolve locally with \`git fetch herdr && git rebase --onto $TARGET \$(git merge-base main $TARGET) main\`,"
                echo "then copy .git/rr-cache into .github/rr-cache so it replays next time."
              } > out/conflict.md
              git rebase --abort
              echo "status=conflict" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            GIT_EDITOR=true git rebase --continue || true
          done
          # Only drovr's rebased commits; the receiving jobs fetch $TARGET from herdr.
          git bundle create out/rebase.bundle "$TARGET..rebase/herdr-$SHORT"
          echo "status=rebased" >> "$GITHUB_OUTPUT"

      - if: steps.rebase.outputs.status != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rebase
          path: out/
          if-no-files-found: error

  # Builds and tests upstream code: no write token, no persisted credentials,
  # no cache writes.
  test:
    needs: rebase
    if: needs.rebase.outputs.status == 'rebased'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            filter: all()
          - os: macos-15
            filter: not binary(live_handoff)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
      # Keep in sync with KNOWN_FAILURES in drovr-ci.yml.
      KNOWN_FAILURES: >-
        not test(=federated_client_starts_without_local_and_survives_its_restart)
        and not test(=client::endpoint::registry::tests::negotiated_remote_health_probe_expires_the_connection)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rebase
          path: ${{ runner.temp }}/rebase

      - name: Check out the rebased branch
        env:
          TARGET: ${{ needs.rebase.outputs.target }}
          SHORT: ${{ needs.rebase.outputs.short }}
          BUNDLE: ${{ runner.temp }}/rebase/rebase.bundle
        run: |
          git init -q .
          git fetch -q --no-tags https://github.com/herdrdev/herdr.git "$TARGET"
          git fetch -q "$BUNDLE" "rebase/herdr-$SHORT:rebase/herdr-$SHORT"
          git checkout -q "rebase/herdr-$SHORT"
          git log --oneline -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Build and test
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          cargo build --locked
          cargo nextest run --locked --no-fail-fast -E "($FILTER) and $KNOWN_FAILURES" \
            --status-level fail --final-status-level slow --failure-output final --success-output never

  report:
    needs: [rebase, test]
    if: always() && (needs.rebase.outputs.status == 'conflict' || needs.rebase.outputs.status == 'rebased')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: ${{ needs.rebase.outputs.target }}
      SHORT: ${{ needs.rebase.outputs.short }}
      MAIN_SHA: ${{ needs.rebase.outputs.main_sha }}
      REBASE_STATUS: ${{ needs.rebase.outputs.status }}
      TEST_RESULT: ${{ needs.test.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rebase
          path: ${{ runner.temp }}/rebase

      - name: Decide status
        id: status
        run: |
          if [ "$REBASE_STATUS" = conflict ]; then
            status=conflict
          elif [ "$TEST_RESULT" = success ]; then
            status=ready
          else
            status=test-failed
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check push token
        if: steps.status.outputs.status == 'ready'
        env:
          PUSH_TOKEN: ${{ secrets.DROVR_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Secret DROVR_PUSH_TOKEN is not set. Add a fine-grained PAT for $GH_REPO with Contents and Workflows read/write; GITHUB_TOKEN cannot push branches that change workflow files."
            exit 1
          fi

      - name: Push rebase branch
        if: steps.status.outputs.status == 'ready'
        env:
          PUSH_TOKEN: ${{ secrets.DROVR_PUSH_TOKEN }}
          BUNDLE: ${{ runner.temp }}/rebase/rebase.bundle
        run: |
          git init -q .
          git fetch -q --no-tags https://github.com/herdrdev/herdr.git "$TARGET"
          git fetch -q "$BUNDLE" "rebase/herdr-$SHORT:rebase/herdr-$SHORT"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/$GH_REPO.git"
          git push "$remote" "refs/heads/rebase/herdr-$SHORT:refs/heads/rebase/herdr-$SHORT"
          # Records the main commit this rebase replaced; promote uses it as
          # the --force-with-lease expectation. Not a drovr-v* tag, so it does
          # not trigger a release.
          git push --force "$remote" "$MAIN_SHA:refs/tags/drovr-rebase-base-herdr-$SHORT"
          # Older rebases are superseded by this one.
          git ls-remote "$remote" 'refs/heads/rebase/herdr-*' 'refs/tags/drovr-rebase-base-herdr-*' \
            | awk '{print $2}' | { grep -v -e "/rebase/herdr-$SHORT\$" -e "/drovr-rebase-base-herdr-$SHORT\$" || true; } \
            | while read -r ref; do git push "$remote" --delete "$ref"; done

      - name: Update issue
        env:
          STATUS: ${{ steps.status.outputs.status }}
          CONFLICT: ${{ runner.temp }}/rebase/conflict.md
        run: |
          title="drovr rebase onto herdr $SHORT"
          case "$STATUS" in
            ready)
              summary="Rebased cleanly, builds and the tests pass: ready to ship."
              body="Branch \`rebase/herdr-$SHORT\` (replacing main at \`$MAIN_SHA\`) builds and the tests pass on Linux and macOS. Ship it from Actions → **drovr promote** with \`$SHORT\`." ;;
            test-failed)
              summary="Rebased cleanly, but the build or tests fail."
              body="The rebase onto herdr $SHORT applied cleanly, but the build or tests failed: $RUN_URL. Nothing was pushed; the next daily run retries." ;;
            conflict)
              summary="Rebase stopped on conflicts."
              body=$(cat "$CONFLICT") ;;
          esac
          body=$(printf '<!-- drovr-rebase-status: %s -->\n%s\n\nherdr commit: https://github.com/herdrdev/herdr/commit/%s\nLast run: %s\n' \
            "$STATUS" "$body" "$TARGET" "$RUN_URL")
          open=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | startswith("drovr rebase onto herdr ")) | "\(.number) \(.title)"')
          # Issues for older herdr/master commits are superseded by this one.
          echo "$open" | while read -r n t; do
            if [ -n "$n" ] && [ "$t" != "$title" ]; then
              gh issue close "$n" --comment "Superseded by herdr $SHORT: $RUN_URL"
            fi
          done
          number=$(echo "$open" | awk -v t="$title" '{n=$1; $1=""; sub(/^ /, "")} $0 == t {print n; exit}')
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body"
            exit 0
          fi
          previous=$(gh issue view "$number" --json body --jq .body \
            | sed -n 's/^<!-- drovr-rebase-status: \(.*\) -->$/\1/p' | head -1)
          gh issue edit "$number" --body "$body"
          if [ "$previous" != "$STATUS" ]; then
            gh issue comment "$number" --body "$summary $RUN_URL"
          fi
