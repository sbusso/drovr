# drovr: follow herdr. Daily, check whether herdrdev published a newer stable
# release than the one drovr's main is based on. If so, rebase drovr onto it
# and report the result in one issue per herdr release:
#   clean (or replayed by rerere) + tests pass -> push branch rebase/<tag> and
#                                                 mark the issue "ready to ship"
#   tests fail -> nothing is pushed; the issue links the failing run
#   conflict   -> nothing is pushed; the issue lists the conflicting files and
#                 the upstream commits that touched them
# The issue is created once and updated on later runs; a comment is added only
# when the status changes. main is never touched here; "drovr promote" ships a
# ready rebase. Resolutions recorded with `git rerere` live in .github/rr-cache,
# so a conflict resolved once is replayed automatically next time.
#
# Jobs are split so that upstream code is only built in a job that has no
# write token: `rebase` and `test` run with contents: read and no persisted
# credentials; only `report` can push and write issues.
#
# Required secret: DROVR_PUSH_TOKEN, a fine-grained PAT for sbusso/drovr with
# "Contents: read and write" and "Workflows: read and write". GITHUB_TOKEN
# cannot push a branch whose commits change .github/workflows, which upstream
# releases regularly do.
name: drovr rebase

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: drovr-rebase
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      status: ${{ steps.rebase.outputs.status || 'skip' }}
      latest: ${{ steps.find.outputs.latest }}
      base: ${{ steps.find.outputs.base }}
      main_sha: ${{ steps.find.outputs.main_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Find upstream release
        id: find
        run: |
          git remote add upstream https://github.com/herdrdev/herdr.git
          git fetch --quiet upstream --tags
          stable() { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1; }
          latest=$(git tag -l 'v*' | stable)
          base=$(git tag --merged HEAD -l 'v*' | stable)
          echo "latest=$latest base=$base"
          {
            echo "latest=$latest"
            echo "base=$base"
            echo "main_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$latest" ] || [ -z "$base" ] || [ "$latest" = "$base" ] \
            || git ls-remote --exit-code origin "refs/heads/rebase/$latest" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase
        id: rebase
        if: steps.find.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.find.outputs.latest }}
          BASE: ${{ steps.find.outputs.base }}
        run: |
          git config user.name "drovr bot"
          git config user.email "drovr-bot@users.noreply.github.com"
          git config rerere.enabled true
          git config rerere.autoupdate true
          mkdir -p .git/rr-cache && cp -r .github/rr-cache/. .git/rr-cache/ 2>/dev/null || true
          mkdir -p out
          git checkout -b "rebase/$LATEST"
          git rebase --onto "$LATEST" "$BASE" || true
          # rerere stages known resolutions; keep continuing while that is enough.
          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            files=$(git diff --name-only --diff-filter=U)
            if [ -n "$files" ]; then
              {
                echo "Rebasing drovr onto herdr $LATEST stopped on conflicts. Nothing was pushed."
                echo
                echo "Files:"
                # shellcheck disable=SC2016 # literal backticks for markdown
                echo "$files" | sed 's/^/- `/;s/$/`/'
                echo
                echo "Upstream commits touching them ($BASE..$LATEST):"
                echo '```'
                # shellcheck disable=SC2086 # one path per word
                git log --oneline "$BASE..$LATEST" -- $files
                echo '```'
                echo
                echo "Resolve locally with \`git rebase --onto $LATEST $BASE main\`,"
                echo "then copy .git/rr-cache into .github/rr-cache so it replays next time."
              } > out/conflict.md
              git rebase --abort
              echo "status=conflict" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            GIT_EDITOR=true git rebase --continue || true
          done
          # Only the rebased commits; the receiving jobs fetch $LATEST from upstream.
          git bundle create out/rebase.bundle "refs/tags/$LATEST..rebase/$LATEST"
          echo "status=rebased" >> "$GITHUB_OUTPUT"

      - if: steps.rebase.outputs.status != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rebase
          path: out/
          if-no-files-found: error

  # Builds and tests upstream code: no write token, no persisted credentials,
  # no cache writes.
  test:
    needs: rebase
    if: needs.rebase.outputs.status == 'rebased'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            filter: all()
          - os: macos-15
            filter: not binary(live_handoff)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
      # Keep in sync with KNOWN_FAILURES in drovr-ci.yml.
      KNOWN_FAILURES: >-
        not test(=federated_client_starts_without_local_and_survives_its_restart)
        and not test(=client::endpoint::registry::tests::negotiated_remote_health_probe_expires_the_connection)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rebase
          path: ${{ runner.temp }}/rebase

      - name: Check out the rebased branch
        env:
          LATEST: ${{ needs.rebase.outputs.latest }}
          BUNDLE: ${{ runner.temp }}/rebase/rebase.bundle
        run: |
          git init -q .
          git fetch -q --no-tags https://github.com/herdrdev/herdr.git "refs/tags/$LATEST:refs/tags/$LATEST"
          git fetch -q "$BUNDLE" "rebase/$LATEST:rebase/$LATEST"
          git checkout -q "rebase/$LATEST"
          git log --oneline -1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Build and test
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          cargo build --locked
          cargo nextest run --locked --no-fail-fast -E "($FILTER) and $KNOWN_FAILURES" \
            --status-level fail --final-status-level slow --failure-output final --success-output never

  report:
    needs: [rebase, test]
    if: always() && (needs.rebase.outputs.status == 'conflict' || needs.rebase.outputs.status == 'rebased')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LATEST: ${{ needs.rebase.outputs.latest }}
      MAIN_SHA: ${{ needs.rebase.outputs.main_sha }}
      REBASE_STATUS: ${{ needs.rebase.outputs.status }}
      TEST_RESULT: ${{ needs.test.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rebase
          path: ${{ runner.temp }}/rebase

      - name: Decide status
        id: status
        run: |
          if [ "$REBASE_STATUS" = conflict ]; then
            status=conflict
          elif [ "$TEST_RESULT" = success ]; then
            status=ready
          else
            status=test-failed
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check push token
        if: steps.status.outputs.status == 'ready'
        env:
          PUSH_TOKEN: ${{ secrets.DROVR_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Secret DROVR_PUSH_TOKEN is not set. Add a fine-grained PAT for $GH_REPO with Contents and Workflows read/write; GITHUB_TOKEN cannot push branches that change workflow files."
            exit 1
          fi

      - name: Push rebase branch
        if: steps.status.outputs.status == 'ready'
        env:
          PUSH_TOKEN: ${{ secrets.DROVR_PUSH_TOKEN }}
          BUNDLE: ${{ runner.temp }}/rebase/rebase.bundle
        run: |
          git init -q .
          git fetch -q --no-tags https://github.com/herdrdev/herdr.git "refs/tags/$LATEST:refs/tags/$LATEST"
          git fetch -q "$BUNDLE" "rebase/$LATEST:rebase/$LATEST"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/$GH_REPO.git"
          git push "$remote" "refs/heads/rebase/$LATEST:refs/heads/rebase/$LATEST"
          # Records the main commit this rebase replaced; promote uses it as
          # the --force-with-lease expectation. Not a drovr-v* tag, so it does
          # not trigger a release.
          git push --force "$remote" "$MAIN_SHA:refs/tags/drovr-rebase-base-$LATEST"

      - name: Update issue
        env:
          STATUS: ${{ steps.status.outputs.status }}
          CONFLICT: ${{ runner.temp }}/rebase/conflict.md
        run: |
          title="drovr rebase onto herdr $LATEST"
          case "$STATUS" in
            ready)
              summary="Rebased cleanly, builds and the tests pass: ready to ship."
              body="Branch \`rebase/$LATEST\` (replacing main at \`$MAIN_SHA\`) builds and the tests pass on Linux and macOS. Ship it from Actions → **drovr promote** with \`$LATEST\`." ;;
            test-failed)
              summary="Rebased cleanly, but the build or tests fail."
              body="The rebase onto herdr $LATEST applied cleanly, but the build or tests failed: $RUN_URL. Nothing was pushed; the next daily run retries." ;;
            conflict)
              summary="Rebase stopped on conflicts."
              body=$(cat "$CONFLICT") ;;
          esac
          body=$(printf '<!-- drovr-rebase-status: %s -->\n%s\n\nUpstream notes: https://github.com/herdrdev/herdr/releases/tag/%s\nLast run: %s\n' \
            "$STATUS" "$body" "$LATEST" "$RUN_URL")
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body"
            exit 0
          fi
          previous=$(gh issue view "$number" --json body --jq .body \
            | sed -n 's/^<!-- drovr-rebase-status: \(.*\) -->$/\1/p' | head -1)
          gh issue edit "$number" --body "$body"
          if [ "$previous" != "$STATUS" ]; then
            gh issue comment "$number" --body "$summary $RUN_URL"
          fi
