# drovr: build drovr for macOS and Linux (x86_64 and arm64) and publish the
# binaries, their SHA-256 checksums and the installer as a GitHub release on
# every `drovr-v*` tag (e.g. drovr-v0.9.4-1). "drovr promote" pushes that tag.
# Run it by hand with a tag to rebuild or finish a release; publishing is
# idempotent (assets are replaced). Upstream herdr workflows are guarded to
# herdrdev/herdr and do not run on this fork.
name: drovr release

on:
  push:
    tags: ['drovr-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing drovr-v* tag to build and publish, e.g. drovr-v0.9.4-1'
        required: true

permissions: {}

concurrency:
  group: drovr-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^drovr-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a drovr release tag (expected drovr-vX.Y.Z-N)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin, asset: drovr-macos-arm64}
          # Cross-compiled on Apple silicon, as upstream herdr does.
          - {os: macos-15, target: x86_64-apple-darwin, asset: drovr-macos-x86_64}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: drovr-linux-x86_64}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: drovr-linux-arm64}
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      # Read by `drovr update` (src/main.rs) to fetch the installer of this release.
      DROVR_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out
          cargo build --release --locked --target "$TARGET"
          cp "target/$TARGET/release/herdr" "$ASSET"
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET"; else shasum -a 256 "$ASSET"; fi > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cd dist
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          cp ../scripts/drovr-install drovr-install
          files=(drovr-* SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            herdr_version=${TAG#drovr-}
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "drovr build of $(git rev-parse --short HEAD) on herdr ${herdr_version%-*}. See the README for what differs from herdr."
          fi
